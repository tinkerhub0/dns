---
# tharavad.xyz — managed by octoDNS
# PRs for changes, GitHub Actions applies on merge to main
#
# NOTE: Cloudflare free/standard cannot host zone "cf.tharavad.xyz" alone
# (subdomain-as-zone = Enterprise). Options for Headscale tunnel:
#   A) Move this apex to Cloudflare (octoDNS target = cloudflare) + hs.tharavad.xyz
#   B) Keep Hetzner; use a separate domain on CF only for the tunnel
#   C) No CF — port-forward / other
# Do NOT NS-delegate "cf" — it does not create a CF zone on free plans.

# apex + wildcard → edge (public SSH bastion + site)
# members: ssh you@you.tharavad.xyz
'':
  ttl: 300
  type: A
  value: 178.105.120.5

'*':
  ttl: 300
  type: A
  value: 178.105.120.5

auth:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

chat:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

# When apex is on Cloudflare + tunnel exists, set this to the tunnel CNAME
# (e.g. <id>.cfargotunnel.com) or let the Tunnel UI create the record.
# Until then it still points at the main site.
headscale:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

monitor:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

wiki:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

# landa console (static UI)
landa:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

# landa control plane API (edge nginx → :8787)
landa-back:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.

  status:
  ttl: 300
  type: CNAME
  value: tharavad.xyz.
